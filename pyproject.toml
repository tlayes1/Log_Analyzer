[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loganalyze"
version = "0.1.0"
description = "Batch CLI that recognizes attack signatures and statistical anomalies in system and web server logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "loganalyze maintainers" }]
keywords = ["logs", "security", "detection", "siem", "anomaly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

# Core is standard-library only: no runtime dependencies (tech.md).
dependencies = []

[project.optional-dependencies]
# Future accelerated statistical path; not imported by the core (tech.md).
stats = ["numpy>=1.24", "pandas>=2.0"]
dev = ["pytest>=7", "hypothesis>=6", "ruff", "black"]

[project.scripts]
loganalyze = "loganalyze.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
